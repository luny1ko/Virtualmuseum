<!-- index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Виртуальный Музей ЛДПК | Интерактивная экспозиция</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="museum-v2.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Google model-viewer для аппаратного 3D-рендеринга GLB/GLTF моделей -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>
  <div id="app" class="museum-app">
    <!-- Фоновый видеоконтейнер и резервный слой статичного кадра -->
    <div class="viewport-stage">
      <video id="hall-video" class="hall-video" autoplay muted playsinline preload="auto"></video>
      <div id="hall-bg" class="hall-bg"></div>
      <div class="cinematic-vignette"></div>
    </div>

    <!-- Интерактивный слой витрин (хотспотов) на панораме -->
    <div id="hotspots-layer" class="hotspots-layer" aria-label="Витрины и стенды зала"></div>

    <!-- Верхняя парящая навигационная шапка -->
    <header class="navigation-header">
      <div class="brand-badge">
        <svg class="badge-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18M3 10h18M5 10v11M19 10v11M9 10v11M15 10v11M12 2L2 7h20L12 2z"/>
        </svg>
        <span class="badge-title">МУЗЕЙ ЛДПК</span>
      </div>

      <nav class="nav-capsule" id="hall-nav" aria-label="Залы музея">
        <div class="nav-active-pill" id="nav-pill"></div>
      </nav>

      <!-- Кнопка 1: Интерактивный план здания -->
      <button id="btn-open-map" class="header-action-btn" type="button" title="План здания (Клавиша M)">
        <svg class="header-btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
          <line x1="8" y1="2" x2="8" y2="18"></line>
          <line x1="16" y1="6" x2="16" y2="22"></line>
        </svg>
        <span class="header-btn-text">План здания</span>
      </button>

      <!-- Кнопка 2: Каталог экспонатов (Bottom Sheet) -->
      <button id="btn-open-catalog" class="header-action-btn" type="button" title="Каталог всех экспонатов">
        <svg class="header-btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span class="header-btn-text">Все экспонаты</span>
      </button>

      <!-- Кнопка 3: Викторина -->
      <button id="btn-open-quiz" class="header-action-btn" type="button" title="Проверить знания по истории ЛДПК">
        <svg class="header-btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
          <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
        </svg>
        <span class="header-btn-text">Викторина</span>
      </button>

      <!-- Кнопка 4: Облегчённый режим (Lite Mode) -->
      <button id="btn-toggle-lite" class="header-action-btn" type="button" title="Переключить облегченный режим (экономия GPU)">
        <svg class="header-btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        <span id="lite-btn-text" class="header-btn-text">Lite</span>
      </button>

      <div class="status-indicator" id="system-status" title="Статус экспозиции">
        <span class="status-dot"></span>
        <span class="status-text">Онлайн</span>
      </div>

      <!-- Вход в панель администратора -->
      <a href="admin.html" class="admin-entry-link" title="Панель администратора музея">
        <svg class="admin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </a>
    </header>

    <!-- Всплывающая интерактивная мини-карта здания (соотношение схемы 1:2) -->
    <div id="map-modal-backdrop" class="map-modal-backdrop" aria-hidden="true"></div>
    <section id="map-modal" class="map-modal" role="dialog" aria-modal="true" aria-labelledby="map-modal-heading" aria-hidden="true">
      <div class="map-modal-container">
        <header class="map-modal-header">
          <div class="map-title-wrapper">
            <span class="map-tag">Архитектурная схема здания</span>
            <h2 id="map-modal-heading" class="map-modal-title">План музея ЛДПК</h2>
          </div>
          <div class="map-header-tools">
            <span class="map-hotkey-badge">Горячая клавиша: <kbd>M</kbd></span>
            <button id="map-close-btn" class="map-close-btn" type="button" aria-label="Закрыть план">&times;</button>
          </div>
        </header>

        <div class="map-canvas-wrapper">
          <svg id="museum-svg-map" class="museum-svg-map vertical-plan" viewBox="0 0 420 800" preserveAspectRatio="xMidYMid meet">
            <defs>
              <pattern id="floor-grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
                <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
              </pattern>
            </defs>

            <rect width="100%" height="100%" fill="url(#floor-grid-pattern)" rx="12" />

            <!-- КОМНАТА 1: История ЛДПК (Верхний широкий блок) -->
            <g class="map-hall-group" id="map-hall-college-history" data-hall-id="college-history" tabindex="0">
              <rect x="20" y="20" width="380" height="230" rx="8" class="hall-polygon hall-1-poly"/>
              <text x="40" y="55" class="hall-svg-room-num">I</text>
              <text x="70" y="55" class="hall-svg-title">01. ИСТОРИЯ ЛДПК</text>
              <text x="385" y="55" class="hall-svg-epoch" text-anchor="end">1941–1990 гг.</text>
              <g class="user-beacon-slot" id="beacon-college-history" transform="translate(40, 80)"></g>
            </g>

            <!-- КОМНАТА 4: Достижения (Левый высокий вертикальный блок) -->
            <g class="map-hall-group" id="map-hall-achievements" data-hall-id="achievements" tabindex="0">
              <rect x="20" y="260" width="155" height="520" rx="8" class="hall-polygon hall-4-poly"/>
              <text x="40" y="295" class="hall-svg-room-num">4</text>
              <text x="40" y="325" class="hall-svg-title-vertical">ДОСТИЖЕНИЯ</text>
              <g class="user-beacon-slot" id="beacon-achievements" transform="translate(40, 355)"></g>
            </g>

            <!-- КОМНАТА 2: Быт и культура края (Правый верхний блок) -->
            <g class="map-hall-group" id="map-hall-region-history" data-hall-id="region-history" tabindex="0">
              <rect x="185" y="260" width="215" height="280" rx="8" class="hall-polygon hall-2-poly"/>
              <text x="385" y="295" class="hall-svg-room-num" text-anchor="end">2</text>
              <text x="205" y="295" class="hall-svg-title">02. БЫТ И КУЛЬТУРА</text>
              <g class="user-beacon-slot" id="beacon-region-history" transform="translate(205, 325)"></g>
            </g>

            <!-- КОМНАТА 3: Военная память (Правый нижний блок) -->
            <g class="map-hall-group" id="map-hall-military-glory" data-hall-id="military-glory" tabindex="0">
              <rect x="185" y="550" width="215" height="230" rx="8" class="hall-polygon hall-3-poly"/>
              <text x="385" y="585" class="hall-svg-room-num" text-anchor="end">3</text>
              <text x="205" y="585" class="hall-svg-title">03. ВОЕННАЯ ПАМЯТЬ</text>
              <g class="user-beacon-slot" id="beacon-military-glory" transform="translate(205, 615)"></g>
            </g>

            <!-- Дверные проёмы со схемы -->
            <line x1="50" y1="250" x2="105" y2="250" class="hall-doorway-pass" title="Проход Зал 1 - Зал 4" />
            <line x1="250" y1="250" x2="310" y2="250" class="hall-doorway-pass" title="Проход Зал 1 - Зал 2" />
            <line x1="250" y1="540" x2="310" y2="540" class="hall-doorway-pass" title="Проход Зал 2 - Зал 3" />
            <line x1="175" y1="650" x2="175" y2="710" class="hall-doorway-pass vertical-door" title="Проход Зал 4 - Зал 3" />

            <!-- Динамический слой витрин карты -->
            <g id="map-dynamic-nodes-layer" class="map-dynamic-nodes-layer"></g>
          </svg>
        </div>

        <footer class="map-modal-footer">
          <div class="map-legend">
            <span class="legend-item"><span class="legend-dot current"></span> Вы здесь</span>
            <span class="legend-item"><span class="legend-dot vitrine"></span> Витрина</span>
          </div>
          <p class="map-instructions">Клик по витрине переносит в зал и открывает стенд</p>
        </footer>
      </div>
    </section>

    <!-- Затеняющий оверлей шторки витрины -->
    <div id="drawer-backdrop" class="drawer-backdrop"></div>

    <!-- Выдвижная информационная панель витрины (Drawer) -->
    <aside id="exhibit-drawer" class="exhibit-drawer" aria-hidden="true" role="dialog" aria-labelledby="drawer-title">
      <div class="drawer-content">
        <div class="drawer-header-bar">
          <div id="media-mode-toggle" class="media-mode-toggle hidden">
            <button type="button" class="mode-btn active" id="btn-mode-3d">🧊 3D Модель</button>
            <button type="button" class="mode-btn" id="btn-mode-gallery">🖼 Галерея</button>
          </div>
          <button id="drawer-close" class="drawer-close-btn" type="button" aria-label="Закрыть панель">&times;</button>
        </div>

        <div class="drawer-media-box">
          <div id="model-3d-wrapper" class="model-3d-wrapper hidden">
            <model-viewer id="drawer-model"
              camera-controls
              auto-rotate
              shadow-intensity="1.5"
              exposure="1"
              ar
              touch-action="pan-y">
            </model-viewer>
          </div>

          <div id="gallery-wrapper" class="gallery-wrapper">
            <div class="gallery-viewport">
              <img id="gallery-current-img" src="" alt="Экспонат витрины" class="drawer-media-img">
            </div>

            <button id="gallery-prev" class="gallery-nav-btn prev" type="button" aria-label="Предыдущее фото">&#10094;</button>
            <button id="gallery-next" class="gallery-nav-btn next" type="button" aria-label="Следующее фото">&#10095;</button>

            <div class="gallery-caption-bar">
              <span id="gallery-caption-text" class="gallery-caption-text"></span>
              <span id="gallery-counter" class="gallery-counter">1 / 1</span>
            </div>

            <div id="gallery-dots" class="gallery-dots"></div>
          </div>

          <span id="drawer-epoch" class="epoch-badge"></span>
        </div>

        <div class="drawer-body">
          <h2 id="drawer-title" class="drawer-title"></h2>
          <div class="drawer-divider"></div>
          <div id="drawer-extra-info" class="drawer-extra-info"></div>
          <p id="drawer-description" class="drawer-description"></p>
        </div>

        <div class="drawer-footer">
          <button id="audioguide-btn" class="audioguide-btn" type="button">
            <span class="audio-icon-box">
              <svg class="audio-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path class="wave-1" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path class="wave-2" d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
              </svg>
            </span>
            <span id="audioguide-text" class="audio-btn-label">Слушать экскурсовода</span>
            <span class="audio-equalizer" aria-hidden="true">
              <span class="eq-bar"></span>
              <span class="eq-bar"></span>
              <span class="eq-bar"></span>
            </span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Прелоадер перехода -->
    <div id="transition-loader" class="transition-loader" aria-hidden="true">
      <div class="spinner"></div>
      <span class="loader-text" id="loader-status">Перемещение...</span>
    </div>

    <!-- КАТАЛОГ ВСЕХ ЭКСПОНАТОВ (BOTTOM SHEET) -->
    <div id="catalog-backdrop" class="catalog-backdrop" aria-hidden="true"></div>
    <aside id="catalog-sheet" class="catalog-sheet" role="dialog" aria-modal="true" aria-labelledby="catalog-title" aria-hidden="true">
      <div class="sheet-drag-handle-bar">
        <div class="sheet-drag-handle"></div>
      </div>
      <header class="sheet-header">
        <div class="sheet-title-box">
          <span class="sheet-badge">ФОНДЫ МУЗЕЯ ЛДПК</span>
          <h2 id="catalog-title" class="sheet-title">Каталог всех витрин и экспонатов</h2>
        </div>
        <div class="sheet-controls">
          <div class="sheet-filter-chips" id="catalog-filters">
            <button class="filter-chip active" type="button" data-filter="all">Все витрины</button>
            <button class="filter-chip" type="button" data-filter="college-history">01. История ЛДПК</button>
            <button class="filter-chip" type="button" data-filter="region-history">02. Быт и культура</button>
            <button class="filter-chip" type="button" data-filter="military-glory">03. Военная память</button>
            <button class="filter-chip" type="button" data-filter="achievements">04. Достижения</button>
          </div>
          <button id="catalog-close-btn" class="sheet-close-btn" type="button" aria-label="Закрыть каталог">&times;</button>
        </div>
      </header>
      <div class="sheet-body">
        <div id="catalog-grid" class="catalog-grid"></div>
      </div>
    </aside>

    <!-- МОДУЛЬ ВИКТОРИНЫ (QUIZ MODAL) -->
    <div id="quiz-backdrop" class="quiz-backdrop" aria-hidden="true"></div>
    <section id="quiz-modal" class="quiz-modal" role="dialog" aria-modal="true" aria-labelledby="quiz-modal-title" aria-hidden="true">
      <div class="quiz-modal-container">
        <header class="quiz-header">
          <div class="quiz-header-badge-box">
            <span class="quiz-badge">ОБРАЗОВАТЕЛЬНЫЙ ТРЕК</span>
            <h2 id="quiz-modal-title" class="quiz-title">Викторина: Знаток истории ЛДПК</h2>
          </div>
          <button id="quiz-close-btn" class="quiz-close-btn" type="button" aria-label="Закрыть тест">&times;</button>
        </header>

        <div id="quiz-body" class="quiz-body"></div>
      </div>
    </section>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
