<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Виртуальный Музей | Интерактивная экспозиция</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Google model-viewer для аппаратного 3D рендеринга GLB/GLTF моделей -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>
  <div id="app" class="museum-app">
    <!-- Фоновый видеоконтейнер и резервный слой кадра -->
    <div class="viewport-stage">
      <video id="hall-video" class="hall-video" autoplay muted playsinline preload="auto"></video>
      <div id="hall-bg" class="hall-bg"></div>
      <div class="cinematic-vignette"></div>
    </div>

    <!-- Интерактивный слой витрин (хотспотов) -->
    <div id="hotspots-layer" class="hotspots-layer" aria-label="Витрины и стенды зала"></div>

    <!-- Верхняя парящая навигационная капсула -->
    <header class="navigation-header">
      <div class="brand-badge">
        <svg class="badge-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18M3 10h18M5 10v11M19 10v11M9 10v11M15 10v11M12 2L2 7h20L12 2z"/>
        </svg>
        <span class="badge-title">МУЗЕЙ</span>
      </div>

      <nav class="nav-capsule" id="hall-nav" aria-label="Залы музея">
        <div class="nav-active-pill" id="nav-pill"></div>
      </nav>

      <div class="status-indicator" id="system-status" title="Статус экспозиции">
        <span class="status-dot"></span>
        <span class="status-text">Онлайн</span>
      </div>

      <!-- Вход в панель управления в текущей вкладке -->
      <a href="admin.html" class="admin-entry-link" title="Панель администратора музея">
        <svg class="admin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </a>
    </header>

    <!-- Затеняющий оверлей -->
    <div id="drawer-backdrop" class="drawer-backdrop"></div>

    <!-- Выдвижная информационная панель витрины (Drawer) -->
    <aside id="exhibit-drawer" class="exhibit-drawer" aria-hidden="true" role="dialog" aria-labelledby="drawer-title">
      <div class="drawer-content">
        
        <!-- Выделенная верхняя панель (крестик больше никогда не наползает на фото) -->
        <div class="drawer-header-bar">
          <div id="media-mode-toggle" class="media-mode-toggle hidden">
            <button type="button" class="mode-btn active" id="btn-mode-3d">🧊 3D Модель</button>
            <button type="button" class="mode-btn" id="btn-mode-gallery">🖼 Галерея</button>
          </div>
          <button id="drawer-close" class="drawer-close-btn" aria-label="Закрыть панель">&times;</button>
        </div>

        <!-- Медиа-контейнер витрины -->
        <div class="drawer-media-box">
          <div id="model-3d-wrapper" class="model-3d-wrapper hidden">
            <model-viewer id="drawer-model"
              camera-controls
              auto-rotate
              shadow-intensity="1.5"
              exposure="1"
              ar
              touch-action="pan-y">
            </model-viewer>
          </div>

          <div id="gallery-wrapper" class="gallery-wrapper">
            <div class="gallery-viewport">
              <img id="gallery-current-img" src="" alt="Экспонат витрины" class="drawer-media-img">
            </div>

            <button id="gallery-prev" class="gallery-nav-btn prev" aria-label="Предыдущее фото">&#10094;</button>
            <button id="gallery-next" class="gallery-nav-btn next" aria-label="Следующее фото">&#10095;</button>

            <div class="gallery-caption-bar">
              <span id="gallery-caption-text" class="gallery-caption-text"></span>
              <span id="gallery-counter" class="gallery-counter">1 / 1</span>
            </div>

            <div id="gallery-dots" class="gallery-dots"></div>
          </div>

          <span id="drawer-epoch" class="epoch-badge"></span>
        </div>

        <div class="drawer-body">
          <h2 id="drawer-title" class="drawer-title"></h2>
          <div class="drawer-divider"></div>
          
          <div id="drawer-extra-info" class="drawer-extra-info"></div>
          <p id="drawer-description" class="drawer-description"></p>
        </div>

        <div class="drawer-footer">
          <button id="audioguide-btn" class="audioguide-btn" type="button">
            <span class="audio-icon-box">
              <svg class="audio-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path class="wave-1" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path class="wave-2" d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
              </svg>
            </span>
            <span id="audioguide-text" class="audio-btn-label">Слушать экскурсовода</span>
            <span class="audio-equalizer" aria-hidden="true">
              <span class="eq-bar"></span>
              <span class="eq-bar"></span>
              <span class="eq-bar"></span>
            </span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Прелоадер перехода -->
    <div id="transition-loader" class="transition-loader" aria-hidden="true">
      <div class="spinner"></div>
      <span class="loader-text" id="loader-status">Перемещение...</span>
    </div>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
